<?xml version="1.0" encoding="UTF-8"?>
<!--
  PolyglotScan device mark, transparent (no backing square).
  Copyright (c) 2026 PolyglotScan contributors. See brand/LICENSE.

  Lamp: cool-white carriage bar (modern CIS/CCD lamps read white/cyan;
  older CCFL mixed a slight green). Identity uses that cool-white core
  with a green scan-LED bloom that bleeds past the platen.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="PolyglotScan">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="45%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a5a5a"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d5d7d4"/>
      <stop offset="100%" stop-color="#b4b7b4"/>
    </linearGradient>
    <linearGradient id="lamp-core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8ffd0"/>
      <stop offset="18%" stop-color="#f4fff8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="82%" stop-color="#f4fff8"/>
      <stop offset="100%" stop-color="#b8ffd0"/>
    </linearGradient>
    <filter id="platen-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85 0.95" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.70
                0 0 0 0 0.72
                0 0 0 0 0.70
                0 0 0 0.42 0"/>
    </filter>
    <filter id="green-bloom" x="-80%" y="-20%" width="260%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0.15 0 0 0 0
                0 0.95 0 0 0.12
                0 0 0.35 0 0
                0 0 0 0.95 0" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-bloom" x="-50%" y="-10%" width="200%" height="120%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <clipPath id="platen">
      <rect x="50" y="58" width="156" height="140" rx="3"/>
    </clipPath>
  </defs>

  <!-- hinge strip -->
  <rect x="44" y="40" width="168" height="14" rx="3" fill="#252525"/>
  <circle cx="62" cy="47" r="3.2" fill="#6a6a6a"/>
  <circle cx="194" cy="47" r="3.2" fill="#6a6a6a"/>

  <!-- housing -->
  <rect x="36" y="48" width="184" height="168" rx="16" fill="url(#steel)" stroke="#6e6e6e" stroke-width="2"/>
  <rect x="44" y="56" width="168" height="152" rx="8" fill="url(#bezel)"/>

  <!-- glass -->
  <rect x="50" y="58" width="156" height="140" rx="3" fill="url(#glass)"/>
  <rect x="50" y="58" width="156" height="140" rx="3" filter="url(#platen-noise)"/>
  <!-- faint paper ghost on the bed -->
  <rect x="62" y="78" width="88" height="108" rx="1" fill="#eceeea" opacity="0.35" clip-path="url(#platen)"/>

  <!-- millimetre ticks -->
  <g fill="#8d8d8d" clip-path="url(#platen)">
    <rect x="52" y="62" width="6" height="1"/>
    <rect x="52" y="78" width="9" height="1"/>
    <rect x="52" y="94" width="6" height="1"/>
    <rect x="52" y="110" width="9" height="1"/>
    <rect x="52" y="126" width="6" height="1"/>
    <rect x="52" y="142" width="9" height="1"/>
    <rect x="52" y="158" width="6" height="1"/>
    <rect x="52" y="174" width="9" height="1"/>
    <rect x="52" y="190" width="6" height="1"/>
  </g>

  <!--
    Carriage lamp: taller than the platen so the bar and glow bleed
    above the hinge and below the housing.
  -->
  <rect x="108" y="18" width="40" height="226" fill="#22c55e" opacity="0.55" filter="url(#soft-bloom)"/>
  <g filter="url(#green-bloom)">
    <rect x="118" y="14" width="20" height="232" rx="3" fill="#4ade80" opacity="0.85"/>
    <rect x="121" y="12" width="14" height="236" rx="2.5" fill="url(#lamp-core)"/>
  </g>
  <!-- specular streak on the lamp -->
  <rect x="124" y="16" width="3" height="228" rx="1.2" fill="#ffffff" opacity="0.75"/>
</svg>
